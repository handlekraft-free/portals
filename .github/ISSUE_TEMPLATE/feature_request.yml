name: Feature request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Feature requests are best-effort — for guaranteed delivery of custom features, see [commercial support](../../blob/main/SUPPORT.md).
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the user need or pain point. "I'm always frustrated when…"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like Open Portals to behave?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you've tried, or other approaches you've thought about.
  - type: dropdown
    id: portal
    attributes:
      label: Which portal does this affect?
      multiple: true
      options:
        - Employee
        - Client
        - Student
        - Board
        - Admin
        - Cross-cutting / infrastructure
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
