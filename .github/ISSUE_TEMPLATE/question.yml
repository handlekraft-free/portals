name: Question
description: Ask a question about using or configuring Open Portals
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Have a question? Great — but first:

        - If your fork has [GitHub Discussions](../../discussions) enabled, that's usually a better place for open-ended questions.
        - For installation, deployment, or production help in your specific environment, see [commercial support](../../blob/main/SUPPORT.md) (paid).
        - For security questions, email **robert@handlekraft.ai** directly.
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What are you trying to accomplish? What have you already tried?
  - type: input
    id: version
    attributes:
      label: Open Portals version
      placeholder: "0.1.0"
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I have checked the README, CONTRIBUTING, and SUPPORT docs
          required: true
        - label: I have searched existing issues and discussions
          required: true
