name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Typecheck & version sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify package.json and shared/version.ts are in sync
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          SHARED_VERSION=$(node -e "import('./shared/version.ts').then(m => console.log(m.VERSION)).catch(() => { const c = require('fs').readFileSync('./shared/version.ts','utf8'); const m = c.match(/VERSION\s*=\s*\"([^\"]+)\"/); console.log(m ? m[1] : ''); })")
          echo "package.json: $PKG_VERSION"
          echo "shared/version.ts: $SHARED_VERSION"
          if [ "$PKG_VERSION" != "$SHARED_VERSION" ]; then
            echo "::error::Version mismatch — update both package.json and shared/version.ts"
            exit 1
          fi

      - name: TypeScript check
        run: npm run check
